{% extends 'custemer/custemer_base.html' %}

{% block content %}

<style>
    .success-page {
        min-height: 75vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #f7f7f7;
        padding: 40px 15px;
    }

    .success-card {
        width: 100%;
        max-width: 550px;
        background: #ffffff;
        text-align: center;
        padding: 50px 35px;
        border-radius: 10px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
    }

    .success-icon {
        width: 75px;
        height: 75px;
        margin: 0 auto 25px;
        border-radius: 50%;
        background: #f4511e;
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 40px;
        font-weight: bold;
    }

    .success-title {
        color: #111111;
        font-size: 30px;
        font-weight: 700;
        margin-bottom: 15px;
    }

    .success-message {
        color: #777777;
        font-size: 16px;
        margin-bottom: 10px;
    }

    .redirect-message {
        color: #999999;
        font-size: 14px;
        margin-top: 20px;
    }

    .landing-btn {
        display: inline-block;
        margin-top: 20px;
        padding: 12px 28px;
        background: #f4511e;
        color: white;
        text-decoration: none;
        border-radius: 6px;
        font-weight: 600;
        transition: 0.3s;
    }

    .landing-btn:hover {
        background: #d94316;
        color: white;
    }
</style>

<div class="success-page">
    <div class="success-card">

        <div class="success-icon">
            ✓
        </div>

<!--        title-->
        <h1 class="success-title">
            Booking Successful!
        </h1>

        <p class="success-message">
            Your resort booking has been successfully confirmed.
        </p>

        <p class="success-message">
            Thank you for choosing InnKeeper.
        </p>

         <p class="redirect-message">
            You will be redirected to the landing page in few seconds...
        </p>


         <a href="{% url 'listing_resorts' %}"
           class="landing-btn">
            Go to Landing Page
        </a>
    </div>
</div>
<script>

    setTimeout(function(){
        window.location.href = "{% url 'listing_resorts' %}";
    },2000)

</script>


{% endblock %}
