{% extends 'admin/admin_base.html' %}


{% block content %}

<h1>Owner List</h1>
<table class="table table-striped">
  <tr>
    <th>Name</th>
    <th>Phone</th>
    <th>Email</th>
    <th>Update</th>
    <th>Delete</th>
  </tr>

  {% for i in data %}
  <tr>
    <td>{{i.name}}</td>
    <td>{{i.contact_number}}</td>
    <td>{{i.email}}</td>
    <td><a href="{% url 'update_owner' i.id %}"  class="btn btn-primary">Update</a> </td>
    <td><a href="{% url 'delete_owner' i.id %}" class="btn btn-primary">Delete</a></td>


  </tr>
  {% endfor %}

</table>
{% endblock %}
