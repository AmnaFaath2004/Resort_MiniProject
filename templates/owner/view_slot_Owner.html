{% extends 'owner/owner_base.html' %}

{% block content %}

<div class="container py-4">

    <h2 class="mb-4">Resort Schedules</h2>

    <div class="table-responsive">

        <table class="table align-middle">

            <thead>
                <tr>
                    <th>Resort</th>
                    <th>From Date</th>
                    <th>To Date</th>
                </tr>
            </thead>

            <tbody>

            {% for s in slots %}

                <tr>

                    <td>
                        <strong>{{ s.fecility.resort.name }}</strong>
                    </td>

                    <td>
                        {{ s.from_date }}
                    </td>

                    <td>
                        {{ s.to_date }}
                    </td>
                    <td> <a href="{% url 'delete_slot' s.id %} "  class="btn btn-danger" >Delete</a></td>

                </tr>

            {% empty %}

                <tr>
                    <td colspan="3" class="text-center">
                        No schedules available
                    </td>
                </tr>

            {% endfor %}

            </tbody>

        </table>

    </div>

</div>

{% endblock %}
